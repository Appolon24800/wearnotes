name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  server:
    name: Test server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test ./...

  android:
    name: Build Android apps
    runs-on: ubuntu-latest
    needs: server
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :app:phone:assembleDebug :app:wear:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wearnotes-debug-apks
          path: |
            app/phone/build/outputs/apk/debug/phone-debug.apk
            app/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

  publish:
    name: Publish release and container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs:
      - server
      - android
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew :app:phone:assembleDebug :app:wear:assembleDebug

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/appolon24800/wearnotes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/wearnotes -f visibility=public

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/phone/build/outputs/apk/debug/phone-debug.apk
            app/wear/build/outputs/apk/debug/wear-debug.apk
